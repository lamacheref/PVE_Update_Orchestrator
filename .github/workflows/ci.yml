name: "CI — build & release"

# Compilation sur GitHub, artefacts publiés sur Gitea.
# Versionning : M manuel (jamais ici), m auto si commits "feat:", f sinon.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: "🔖 Version auto (m/f)"
    runs-on: ubuntu-latest
    # Garde anti-double-exécution : la release (bump+tag) n'est faite QUE par la CI GitHub.
    # Sans ça, chaque plateforme exécutant ce workflow crée son propre commit chore(release) divergent.
    if: github.repository == 'lamacheref/PVE_Update_Orchestrator' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump auto (m si feat:, sinon f)
        id: bump
        run: |
          NEW="$(bash scripts/bump.sh auto)"
          echo "version=$NEW" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- VERSION; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Entrée CHANGELOG
        if: steps.bump.outputs.changed == 'true'
        run: |
          NEW="${{ steps.bump.outputs.version }}"
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          RANGE="HEAD"; [ -n "$BASE" ] && RANGE="$BASE..HEAD"
          { echo "## [$NEW] - $(date +%F)"; echo; git log --format='- %s (%h)' "$RANGE" | head -30; echo; } >/tmp/entry.md
          awk -v f=/tmp/entry.md '/^## \[Unreleased\]/{print; while((getline l < f)>0) print l; next}1' CHANGELOG.md >/tmp/cl.md
          mv /tmp/cl.md CHANGELOG.md

      - name: Commit + tag + push
        if: steps.bump.outputs.changed == 'true'
        run: |
          NEW="${{ steps.bump.outputs.version }}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): v$NEW" -- VERSION CHANGELOG.md
          git tag "v$NEW"
          git push origin HEAD:main "v$NEW"

  build:
    name: "🏗️ Build linux/${{ matrix.arch }} + tests"
    runs-on: ubuntu-latest
    needs: [version]
    if: always()
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.changed == 'true' && 'main' || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet + tests
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          mkdir -p dist
          V="$(tr -d '[:space:]' <VERSION)"
          GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-X main.version=$V" \
            -o "dist/pve-orchestrator-linux-${{ matrix.arch }}" .

      - name: Checksums
        run: (cd dist && sha256sum * >SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: pve-orchestrator-${{ matrix.arch }}
          path: dist/

  gitea-release:
    name: "📦 Release Gitea + artefacts"
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.repository == 'lamacheref/PVE_Update_Orchestrator' && (needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: pve-orchestrator-*
          merge-multiple: true
          path: dist/

      - name: Publie la release sur Gitea
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' <VERSION)"
          TAG="v$V"
          REPO="flamachere/PVE_Update_Orchestrator"
          BODY="$(awk "/^## \\[$V\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md | head -40)"
          [ -z "$BODY" ] && BODY="Release $TAG"
          PAYLOAD="$(jq -n --arg t "$TAG" --arg b "$BODY" \
            '{tag_name:$t, name:$t, body:$b, draft:false, prerelease:false}')"
          ID="$(curl -sS -X POST "$GITEA_URL/api/v1/repos/$REPO/releases" \
            -H "Authorization: token $GITEA_TOKEN" -H 'Content-Type: application/json' \
            -d "$PAYLOAD" | jq -r '.id // empty')"
          if [ -z "$ID" ]; then
            ID="$(curl -sS "$GITEA_URL/api/v1/repos/$REPO/releases/tags/$TAG" \
              -H "Authorization: token $GITEA_TOKEN" | jq -r '.id // empty')"
          fi
          [ -z "$ID" ] && { echo "release Gitea introuvable" >&2; exit 1; }
          for f in dist/*; do
            echo "⬆️ $(basename "$f")"
            curl -sS -X POST "$GITEA_URL/api/v1/repos/$REPO/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $GITEA_TOKEN" --data-binary "@$f" >/dev/null
          done
