name: "CI — build & release"

# Compilation sur GitHub, artefacts publiés sur Gitea.
# Versionning : M manuel (jamais ici), m auto si commits "feat:", f sinon.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: "🔖 Version auto (m/f)"
    runs-on: ubuntu-latest
    # Garde anti-double-exécution : la release (bump+tag) n'est faite QUE par la CI GitHub.
    # Sans ça, chaque plateforme exécutant ce workflow crée son propre commit chore(release) divergent.
    if: github.repository == 'lamacheref/PVE_Update_Orchestrator' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      version: ${{ steps.bump.outputs.version }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump auto (m si feat:, sinon f)
        id: bump
        run: |
          NEW="$(bash scripts/bump.sh auto)"
          echo "version=$NEW" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- VERSION; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Entrée CHANGELOG
        if: steps.bump.outputs.changed == 'true'
        run: |
          NEW="${{ steps.bump.outputs.version }}"
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          RANGE="HEAD"; [ -n "$BASE" ] && RANGE="$BASE..HEAD"
          { echo "## [$NEW] - $(date +%F)"; echo; git log --format='- %s (%h)' "$RANGE" | head -30; echo; } >/tmp/entry.md
          awk -v f=/tmp/entry.md '/^## \[Unreleased\]/{print; while((getline l < f)>0) print l; next}1' CHANGELOG.md >/tmp/cl.md
          mv /tmp/cl.md CHANGELOG.md

      - name: Commit + tag + push
        if: steps.bump.outputs.changed == 'true'
        run: |
          NEW="${{ steps.bump.outputs.version }}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): v$NEW" -- VERSION CHANGELOG.md
          git tag "v$NEW"
          git push origin HEAD:main "v$NEW"

  test:
    name: "🧪 Vet + tests"
    runs-on: ubuntu-latest
    needs: [version]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet + tests
        run: |
          go vet ./...
          go test ./...

  release-github:
    name: "📦 Build + release GitHub"
    runs-on: ubuntu-latest
    needs: [version, test]
    if: github.repository == 'lamacheref/PVE_Update_Orchestrator' && (needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (needs.version.outputs.changed == 'true' && 'main') || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet + tests + build
        run: |
          go vet ./...
          go test ./...
          mkdir -p dist
          V="$(tr -d '[:space:]' <VERSION)"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.version=$V" \
              -o "dist/pve-orchestrator-linux-$arch" .
          done
          (cd dist && sha256sum * >SHA256SUMS.txt)

      - name: Publie la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' <VERSION)"
          TAG="v$V"
          BODY="$(awk "/^## \\[$V\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md | head -40)"
          [ -z "$BODY" ] && BODY="Release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$BODY"
          gh release upload "$TAG" dist/* --clobber

  release-gitea:
    name: "📦 Build + release Gitea"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.repository == 'flamachere/PVE_Update_Orchestrator'
    env:
      # URL générée depuis le contexte : chaque plateforme publie chez elle.
      # Ici = https://gitea.smiden.eu (jamais lamachere.fr, jamais en secret).
      REGISTRY_URL: ${{ github.server_url }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet + tests + build
        run: |
          go vet ./...
          go test ./...
          mkdir -p dist
          V="$(tr -d '[:space:]' <VERSION)"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.version=$V" \
              -o "dist/pve-orchestrator-linux-$arch" .
          done
          (cd dist && sha256sum * >SHA256SUMS.txt)

      - name: Vérifie les secrets
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::REGISTRY_USER et/ou REGISTRY_TOKEN vides (secrets du dépôt Gitea)."
            exit 1
          fi
          echo "✅ secrets présents"

      - name: Publie la release Gitea (idempotent)
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' <VERSION)"
          TAG="v$V"
          REPO="flamachere/PVE_Update_Orchestrator"
          AUTH="$REGISTRY_USER:$REGISTRY_TOKEN"
          API="$REGISTRY_URL/api/v1/repos/$REPO"
          OUT="$(curl -sS -u "$AUTH" "$API/releases/tags/$TAG")"
          ID="$(printf '%s' "$OUT" | jq -r '.id // empty')"
          if [ -z "$ID" ]; then
            BODY="$(awk "/^## \\[$V\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md | head -40)"
            [ -z "$BODY" ] && BODY="Release $TAG"
            PAYLOAD="$(jq -n --arg t "$TAG" --arg b "$BODY" \
              '{tag_name:$t, name:$t, body:$b, draft:false, prerelease:false}')"
            OUT="$(curl -sS -u "$AUTH" -X POST "$API/releases" \
              -H 'Content-Type: application/json' -d "$PAYLOAD")"
            ID="$(printf '%s' "$OUT" | jq -r '.id // empty')"
            [ -z "$ID" ] && { echo "::error::création release : $(printf '%s' "$OUT" | head -c 300)"; exit 1; }
          fi
          HAVE="$(curl -sS -u "$AUTH" "$API/releases/$ID/assets" | jq -r '.[].name')"
          for f in dist/*; do
            if printf '%s\n' "$HAVE" | grep -qx "$(basename "$f")"; then
              echo "⏭️ $(basename "$f") déjà publié"
            else
              echo "⬆️ $(basename "$f")"
              curl -sS -u "$AUTH" -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
                --data-binary "@$f" >/dev/null
            fi
          done
